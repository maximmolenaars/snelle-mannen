<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <clipPath id="c"><circle cx="50" cy="50" r="50"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <!-- Jamaican flag: gold ground, green top/bottom, black left/right triangles -->
    <rect width="100" height="100" fill="#FED100"/>
    <polygon points="0,0 100,0 50,50" fill="#009B3A"/>
    <polygon points="0,100 100,100 50,50" fill="#009B3A"/>
    <polygon points="0,0 0,100 50,50" fill="#000000"/>
    <polygon points="100,0 100,100 50,50" fill="#000000"/>
    <!-- gold saltire -->
    <line x1="0" y1="0" x2="100" y2="100" stroke="#FED100" stroke-width="12"/>
    <line x1="100" y1="0" x2="0" y2="100" stroke="#FED100" stroke-width="12"/>
    <!-- lightning bolt (the 'Lightning Bolt') -->
    <path d="M58 16 L34 54 L48 54 L42 84 L70 42 L54 42 Z"
          fill="#ffffff" stroke="#0a0a0b" stroke-width="2.5" stroke-linejoin="round"/>
  </g>
  <circle cx="50" cy="50" r="49" fill="none" stroke="rgba(0,0,0,0.35)" stroke-width="2"/>
</svg>
