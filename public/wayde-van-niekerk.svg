<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <clipPath id="c"><circle cx="50" cy="50" r="50"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <!-- South African flag (simplified) -->
    <rect width="100" height="100" fill="#E03C31"/>
    <polygon points="0,55 100,55 100,100 0,100" fill="#001489"/>
    <!-- white pall -->
    <polygon points="0,18 0,40 30,50 0,60 0,82 50,57 100,57 100,43 50,43" fill="#ffffff"/>
    <!-- green pall -->
    <polygon points="0,24 0,36 34,50 0,64 0,76 44,54 100,54 100,46 44,46" fill="#007A4D"/>
    <!-- gold + black hoist triangle -->
    <polygon points="0,12 0,88 44,50" fill="#FFB81C"/>
    <polygon points="0,20 0,80 34,50" fill="#000000"/>
    <!-- '400' nod -->
    <text x="68" y="56" font-family="Arial, sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">400</text>
  </g>
  <circle cx="50" cy="50" r="49" fill="none" stroke="rgba(0,0,0,0.35)" stroke-width="2"/>
</svg>
